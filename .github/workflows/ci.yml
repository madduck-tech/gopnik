# A verification gate that is itself unverified would be self-refuting.
#
# Since #33 the product is three skills and nothing that runs by itself, so the
# failure mode that matters is the quiet one in the other direction: an install
# that takes a decision on the user's behalf. Several steps below assert an
# absence — no wiring, no hook scripts, no edit to a file the project owns.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The oldest supported runtime is not a formality: the setup script
        # ships into other people's projects, and that is where a
        # version-specific syntax error would surface instead of here.
        python-version: ["3.10", "3.13"]
    name: Skills (py${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        # `compileall` on a missing path prints a complaint and exits 0, so the
        # path is asserted first. This step silently compiled nothing after the
        # scripts moved under plugins/ and stayed green throughout.
        run: |
          test -f plugins/gopnik/skills/gopnik-setup/gopnik_setup.py
          python3 -m compileall -q plugins scripts tests

      # The two slash commands drive the whole working cycle and had no check
      # of any kind: check_parity.py globs plugins/*/skills/*, nothing here
      # touched .claude/commands/, and `claude plugin validate` accepts
      # frontmatter that is known broken. That is how a zero-indexed `$1`
      # survived in the entry-point command until someone ran it by hand.
      - name: Commands are well formed
        run: |
          python3 scripts/check_commands.py
          python3 tests/test_commands.py

      # The fixture pack is what both stages point the skills at, and the
      # oracles are what read the result. An oracle that cannot fail costs a
      # billed agent session and proves nothing, so every rejection it owes is
      # exercised here against a synthetic transcript.
      - name: Fixtures agree with their expectations, and the oracles can fail
        run: python3 tests/test_fixtures.py

      # Setup is the first thing a new user meets, and two of its properties
      # are usually untestable: that it writes down only checks it actually
      # ran, and that what the user reads is free of vocabulary that means
      # nothing to them. Both are pinned to checks that can fail.
      - name: Setup works, and reads like something a person would write
        run: python3 tests/test_setup.py

      # The primary agent prompts are checked against their local guides here;
      # the repository-local fallback is exercised in the installer job below.
      # That keeps both the one-line entrance and the route behind it executable.
      - name: README and agent guides agree
        if: matrix.python-version == '3.12' || matrix.python-version == '3.13'
        run: |
          python3 tests/test_readme.py
          python3 tests/test_guides.py
          python3 tests/test_brand.py
          python3 tests/test_identity.py

  docs:
    runs-on: ubuntu-latest
    name: Translation parity
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Two language versions drift silently: a section gets added to one and
      # not the other, and whoever follows the stale one misses a step.
      - name: English and Russian describe the same thing
        run: python3 scripts/check_parity.py
      - name: Example configuration is valid JSON
        run: python3 -c "import json; json.load(open('gopnik.example.json'))"
      # A malformed issue form does not error anywhere — GitHub quietly falls
      # back to a blank issue, and the one field the cycle depends on stops
      # being asked for. Nothing else in this repository would notice.
      - name: Issue forms parse
        run: |
          # Not in the runner's Python, though it is in most local ones — which
          # is how this step failed the first time it ran.
          pip install --quiet pyyaml
          python3 - <<'PY'
          import pathlib, sys, yaml

          for path in sorted(pathlib.Path(".github/ISSUE_TEMPLATE").glob("*.yml")):
              data = yaml.safe_load(path.read_text(encoding="utf-8"))
              print(f"ok: {path}")
              if path.name == "config.yml":
                  continue
              required = [
                  f["id"] for f in data["body"]
                  if f.get("validations", {}).get("required")
              ]
              if "oracle" not in required:
                  print(f"{path}: the 'what would settle it' field must stay required", file=sys.stderr)
                  sys.exit(1)
          PY

  plugin:
    runs-on: ubuntu-latest
    name: Plugin and installer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # A malformed manifest makes the whole plugin fail to load, and the
      # marketplace is the path most people will use.
      - name: Manifests are valid and point at files that exist
        run: |
          python3 - <<'PY'
          import json, pathlib, sys

          market = json.load(open(".claude-plugin/marketplace.json"))
          root = pathlib.Path(market.get("metadata", {}).get("pluginRoot", "."))
          problems = []

          for entry in market["plugins"]:
              # The loader rejects a bare name even when metadata.pluginRoot is
              # set, with "source: Invalid input". The documentation permits that
              # form; the loader is the authority. Caught 2026-08-15 by a real
              # install, after every static check had passed.
              if not str(entry["source"]).startswith("./"):
                  problems.append(f"{entry['name']}: source must be an explicit relative path, got {entry['source']!r}")
                  continue
              plugin_dir = pathlib.Path(root) / entry["source"]
              manifest = plugin_dir / ".claude-plugin" / "plugin.json"
              if not manifest.exists():
                  problems.append(f"{entry['name']}: no manifest at {manifest}")
                  continue
              plugin = json.load(open(manifest))
              if plugin["name"] != entry["name"]:
                  problems.append(f"{entry['name']}: name disagrees with plugin.json ({plugin['name']})")
              if plugin.get("version") != entry.get("version"):
                  problems.append(f"{entry['name']}: version disagrees with plugin.json")
              # skills/ is loaded by convention. Naming it in the manifest
              # registers the same files twice and the plugin fails to load
              # *after* installing successfully - which reads as a working
              # install right up until the skill should have appeared.
              # Caught 2026-08-15.
              for key in ("skills", "hooks"):
                  if key in plugin:
                      problems.append(f"{entry['name']}: plugin.json must not declare {key!r} - it is loaded by convention and declaring it duplicates the load")
              skills_dir = plugin_dir / "skills"
              if not skills_dir.is_dir():
                  problems.append(f"{entry['name']}: no skills/ directory at the conventional path")
              for skill in sorted(skills_dir.iterdir()):
                  if skill.is_dir() and not (skill / "SKILL.md").exists():
                      problems.append(f"{entry['name']}: {skill.name}/ has no SKILL.md")

          if problems:
              print("\n".join("- " + p for p in problems), file=sys.stderr)
              sys.exit(1)
          print("manifests ok")
          PY

      # The one-liner remains the manual repository fallback, and it exercises
      # code the clone path never reaches: piped through sh there is no source
      # tree beside the script, so it has to fetch its own payload over the
      # network. Pinned to this revision rather than main, or the test would
      # pass on someone else's commit.
      - name: The one-liner installs without a clone
        env:
          GOPNIK_REF: ${{ github.sha }}
        run: |
          mkdir -p /tmp/oneliner && cd /tmp/oneliner
          cat "$GITHUB_WORKSPACE/install.sh" | sh -s -- --codex
          test -f .agents/skills/gopnik/SKILL.md

      # The installer is what people run when they are not on Claude Code, and
      # a broken one fails in someone else's repository rather than here.
      - name: Installer produces a working project
        run: |
          mkdir -p /tmp/proj && cd /tmp/proj
          sh "$GITHUB_WORKSPACE/install.sh" --claude
          test -f .claude/skills/gopnik/SKILL.md
          test -f .claude/skills/gopnik-critic/SKILL.md
          test -f .claude/skills/gopnik-setup/gopnik_setup.py
          test -f gopnik.json
          python3 -c "import json; json.load(open('gopnik.json'))"

          # It must be idempotent: people re-run installers.
          sh "$GITHUB_WORKSPACE/install.sh" --claude
          test -f .claude/skills/gopnik/SKILL.md

      # #33: the install takes no decisions for the user. That is an absence,
      # so it is asserted rather than assumed — a version that quietly wired
      # itself back in would pass every other step in this file.
      - name: Installing touches nothing the project owns
        run: |
          rm -rf /tmp/quiet && mkdir -p /tmp/quiet/.claude && cd /tmp/quiet
          printf '%s' '{"hooks":{"Stop":[{"hooks":[{"type":"command","command":"mine"}]}]}}' \
            > .claude/settings.json
          cp .claude/settings.json /tmp/settings.before
          sh "$GITHUB_WORKSPACE/install.sh" --claude
          sh "$GITHUB_WORKSPACE/install.sh" --codex
          cmp .claude/settings.json /tmp/settings.before
          test ! -e .codex/hooks.json
          test ! -e .claude/hooks
          test ! -e .codex/hooks
          test -z "$(find . -name 'gopnik_gate.py' -o -name 'gopnik_mark.py')"
          echo "installing left every file the project owns alone"

      # The whole point of setup is that what it writes was run first, and that
      # what it writes is read by a person rather than by a program. An
      # end-to-end run is the only place both are true at once.
      - name: Setup completes a real project end to end
        run: |
          rm -rf /tmp/real && mkdir -p /tmp/real && cd /tmp/real
          printf '[project]\nname = "demo"\nversion = "0.1"\n' > pyproject.toml
          mkdir -p tests && printf 'def test_ok():\n    assert True\n' > tests/test_demo.py
          sh "$GITHUB_WORKSPACE/install.sh" --claude --setup
          python3 - <<'PY'
          import json, subprocess
          body = json.load(open("/tmp/real/gopnik.json"))
          stage1 = body["verification"]["stage1"]
          assert stage1, "setup wrote no checks"
          for cmd in stage1:
              got = subprocess.run(cmd, shell=True, cwd="/tmp/real", capture_output=True)
              assert got.returncode == 0, f"wrote a check that fails here: {cmd}"
          # An allowlist rather than a denylist: a key nobody reads is a lie
          # with a schema, and naming the ones we happen to remember would not
          # catch the next one. Keys starting with // are this project's comment
          # convention and carry no behaviour; their *content* is checked by
          # tests/test_setup.py, which reads the file as text.
          extra = {k for k in body if k != "verification" and not k.startswith("//")}
          assert not extra, f"install left keys nothing reads: {extra}"
          print("setup wrote only checks that pass, and nothing dead")
          PY
